<style>
:root{--ink:#1d0806;--ink2:#310d0d;--paper:#fffdf9;--cream:#f5eee4;--line:#dfd5cc;--muted:#766e69;--red:#aa151b;--gold:#f1bf00;--shadow:0 12px 36px rgba(33,12,9,.10);--radius:24px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;color:var(--ink);background:#efe3d6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:Georgia,"Times New Roman",serif}.shell{min-height:100vh;max-width:1680px;margin:auto;padding:14px}.frame{min-height:calc(100vh - 28px);overflow:hidden;border:7px solid var(--ink);border-radius:30px;background:#fff;box-shadow:var(--shadow)}.global-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;min-height:82px;padding:12px 22px;color:#fff;background:linear-gradient(100deg,#190604,#5d0b0f 62%,#130504);border-bottom:1px solid rgba(255,255,255,.12)}.brand{display:flex;align-items:center;gap:12px;min-width:250px}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--gold);border-radius:50%;color:var(--gold);font-weight:900}.brand strong{display:block;font-family:Georgia,serif;font-size:18px;letter-spacing:.04em}.brand small{display:block;margin-top:2px;color:#dccfca;font-size:11px}.nav-links{display:flex;align-items:center;gap:8px;flex:1}.nav-links a{padding:14px 18px;color:#e7dcd7;text-decoration:none;border-radius:15px}.nav-links a[aria-current="page"]{color:#fff;background:linear-gradient(135deg,#761117,#37100e);box-shadow:inset 4px 0 var(--gold)}.progress-chip{padding:11px 16px;border:1px solid var(--gold);border-radius:12px;color:var(--gold);background:transparent;white-space:nowrap}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 96px)}.course-rail{position:sticky;top:82px;align-self:start;height:calc(100vh - 82px);overflow:auto;padding:24px 16px;background:#fbf8f3;border-right:1px solid var(--line)}.rail-heading{margin:0 0 6px;font-weight:800}.rail-meta{font-size:13px;color:var(--muted)}.progress-track{height:7px;margin:12px 0 22px;border-radius:99px;background:#e6dfd8;overflow:hidden}.progress-track span{display:block;height:100%;background:var(--red)}.lesson-list{display:grid;gap:8px}.lesson-link{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;width:100%;padding:12px;text-align:left;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--ink)}.lesson-link .icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#fff;background:var(--red);font-weight:800;font-family:Georgia,serif}.lesson-link strong{display:block;font-size:14px}.lesson-link small{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.25}.lesson-link.active{border-color:#e8d8bd;background:#fff5df;box-shadow:0 7px 18px rgba(57,23,10,.06)}.lesson-link.coming{opacity:.62}.lesson-link.coming .icon{background:#aaa29d}.lesson-link.complete .icon{background:#8a7410}.book-card{margin-top:22px;padding:15px;border:1px solid #e6dccd;border-radius:16px;background:#fffaf0;font-size:12px;line-height:1.55}.book-card strong{display:block;margin-bottom:5px;font-size:14px}.book-card a{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:10px;background:#f5dfac;color:var(--ink);text-decoration:none;font-weight:800}.mobile-catalogue{display:none;padding:14px 18px;background:var(--ink);color:#fff}.mobile-catalogue button{padding:11px 16px;border:0;border-radius:999px;font-weight:900}.mobile-catalogue .toggle-lessons{float:right;background:var(--gold);color:var(--ink)}.mobile-list{display:none;clear:both;padding-top:14px}.mobile-list.open{display:grid;gap:8px}.lesson-page{background:var(--paper);padding:28px clamp(20px,3.3vw,56px) 54px}.breadcrumbs{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:25px}.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:28px}.main-column{min-width:0}.side-column{display:grid;align-content:start;gap:16px}.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);gap:22px;padding:34px;border:1px solid #eadfd4;border-radius:var(--radius);background:radial-gradient(circle at 78% 28%,rgba(241,191,0,.24),transparent 30%),linear-gradient(135deg,#fff,#fffaf2)}.hero:after{content:"ES";position:absolute;right:38px;top:20px;color:rgba(170,21,27,.07);font-size:190px;font-family:Georgia,serif;font-weight:900;transform:rotate(-8deg)}.kicker{margin:0 0 10px;color:#a66c00;font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(58px,7vw,104px);line-height:.9;letter-spacing:-.035em}.subtitle{margin:16px 0 18px;font-family:Georgia,serif;font-style:italic;color:#8b4d10;font-size:25px}.lede{max-width:650px;margin:0;color:#514945;font-size:17px;line-height:1.65}.hero-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}.fact{padding:12px 0;border-top:1px solid #eadfd6}.fact strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.fact span{display:block;margin-top:5px;font-size:13px;line-height:1.4;color:#655b55}.hero-visual{position:relative;min-height:310px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(160deg,#aa151b,#aa151b 52%,#f1bf00)}.hero-visual .spanish{color:rgba(255,255,255,.82);font:700 clamp(46px,6vw,78px)/1 Georgia,serif;text-align:center}.day-note{position:absolute;right:18px;bottom:18px;width:210px;padding:18px;transform:rotate(3deg);border:1px solid #eadfbf;border-radius:4px;background:#fff8d9;box-shadow:0 12px 24px rgba(50,20,10,.18);color:#7b1117;font:italic 16px/1.45 Georgia,serif}.section{margin-top:24px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.section-head h2{margin:0;font-size:29px}.section-head p{margin:0;color:var(--muted);font-size:13px}.curiosity{padding:25px;border:1px solid #ead8cb;border-radius:20px;background:linear-gradient(130deg,#fff9f2,#fff)}.curiosity-label{color:#a66c00;font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.curiosity h2{margin:7px 0 10px;font-size:29px}.sample-spanish{margin-top:18px;padding:18px;border-radius:14px;background:#fff;color:var(--ink);font:700 19px/1.65 Georgia,serif}.reading-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.audio-card{position:relative;padding:22px;border:1px solid #e8ded6;border-radius:18px;background:#fff}.audio-card h3{margin:0 0 4px;font-size:19px}.tag{display:inline-block;margin:5px 0 12px;padding:4px 7px;border-radius:6px;background:#f5e6e6;color:var(--red);font-size:10px;font-weight:800}.audio-placeholder{display:flex;align-items:center;gap:10px;margin:12px 0;padding:11px;border-radius:12px;background:#f5f2ee;color:#6f6761}.play{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:var(--ink);color:#fff}.audio-line{flex:1;height:5px;border-radius:99px;background:#d9d2cc}.study-sequence{display:grid;gap:14px}.study-step{display:grid;grid-template-columns:48px minmax(0,1fr);gap:15px;padding:20px;border:1px solid #e5ddd6;border-radius:18px;background:#fff}.step-number{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:900;font-size:18px}.study-step h3{margin:2px 0 7px;font-size:21px}.study-step p{margin:0;color:#5d554f;line-height:1.6}.reader-turn{margin-top:28px;padding:22px;border:2px solid var(--gold);border-radius:20px;background:linear-gradient(145deg,#fff7dc,#fffdf8)}.reader-checklist{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.reader-check{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e6d29c;border-radius:12px;background:rgba(255,255,255,.86)}.reader-check input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--red)}.path-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.path-card{overflow:hidden;padding:0;border:1px solid #e5ddd7;border-radius:18px;background:#fff;text-align:left}.path-card .colour{height:9px;background:var(--stage)}.path-card .inside{padding:17px}.path-number{display:grid;place-items:center;width:30px;height:30px;margin-bottom:13px;border-radius:50%;background:var(--stage);color:#fff;font-weight:900}.path-card h3{margin:0;font-size:17px}.path-card .eng{display:block;margin-top:4px;color:var(--stage);font-size:12px;font-weight:900}.path-card p{margin:12px 0 0;color:#605852;font-size:12px;line-height:1.5}.path-detail{display:none;margin-top:10px;padding-top:12px;border-top:1px solid #eee5df;color:#4e4742;font-size:13px;line-height:1.6}.path-card[aria-expanded="true"] .path-detail{display:block}.lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.content-card,.side-card{padding:20px;border:1px solid #e5ddd6;border-radius:18px;background:#fff}.content-card h3,.side-card h3{margin:5px 0 9px}.eyebrow{color:var(--red);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.lesson-reflection{padding:16px;border-left:5px solid var(--red);background:#fbf6ef;color:#514945;line-height:1.65}.side-card{border-top:7px solid var(--red)}.side-card.gold{border-top-color:var(--gold)}.side-card a{color:var(--red);font-weight:900}.manifesto{background:linear-gradient(145deg,#1d0806,#5d0b0f);color:#fff}.complete-button{width:100%;padding:14px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:900}.complete-button.done{background:#8a7410}.coming-page{position:relative;overflow:hidden;padding:clamp(34px,6vw,80px);border:1px solid #e3d7cd;border-radius:28px;background:radial-gradient(circle at 88% 12%,rgba(241,191,0,.24),transparent 27%),linear-gradient(145deg,#fffdf9,#fff7e8);box-shadow:var(--shadow)}.coming-page h1{position:relative;font-size:clamp(62px,10vw,126px)}.coming-mark{position:absolute;right:40px;top:20px;color:rgba(170,21,27,.07);font:700 clamp(110px,22vw,280px)/1 Georgia,serif}.coming-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0}.coming-grid article{padding:20px;border:1px solid #e5d9ce;border-radius:18px;background:#fff}.coming-grid span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);font-weight:900}.error{padding:40px;color:#7a2222}@media(max-width:1050px){.lesson-grid{grid-template-columns:1fr}.side-column{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.path-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.shell{padding:0}.frame{border-radius:0;border-width:5px}.global-nav{overflow:auto}.brand{min-width:230px}.nav-links a{white-space:nowrap}.progress-chip{display:none}.app{grid-template-columns:1fr}.course-rail{display:none}.mobile-catalogue{display:block}.lesson-page{padding:22px 18px 45px}.hero-facts,.lower-grid,.reading-grid,.reader-checklist,.coming-grid{grid-template-columns:1fr}.side-column{grid-template-columns:1fr}.path-grid{grid-template-columns:1fr}.day-note{position:relative;right:auto;bottom:auto;margin:120px 15px 15px}.hero-visual{min-height:280px}}@media(max-width:540px){.global-nav{min-height:70px;padding:9px}.brand small{display:none}.nav-links{display:none}.hero{padding:24px}.hero h1{font-size:56px}.lesson-page{padding:18px 12px 40px}}
</style>
</head>
<body>
<div class="shell"><div class="frame">
<nav class="global-nav"><div class="brand"><span class="brand-mark">ES</span><span><strong>The Spanish Experiment</strong><small>A public journey through <em>Poco a Poco</em></small></span></div><div class="nav-links"><a href="index.html#home">Home</a><a href="course.html" aria-current="page">Course</a><a href="index.html#schedule">Schedule</a><a href="index.html#materials">Materials</a><a href="experiment.html">My Experiment</a></div><button class="progress-chip" id="progressChip">0 of 40 complete</button></nav>
<div class="mobile-catalogue"><button>☷ Lessons</button><button class="toggle-lessons" id="mobileToggle">Show lessons</button><div class="mobile-list" id="mobileList"></div></div>
<div class="app"><aside class="course-rail"><p class="rail-heading">Poco a Poco</p><p class="rail-meta">1 of 40 lessons published</p><div class="progress-track"><span id="progressBar" style="width:0%"></span></div><div class="lesson-list" id="desktopLessons"></div><div class="book-card"><strong>Poco a Poco</strong>Guillermo F. Hall Avilés’ public-domain direct-method Spanish course.<br><a href="https://archive.org/details/pocopocoelementa00hallrich" target="_blank" rel="noopener">Open the source book →</a></div></aside><main class="lesson-page" id="lessonPage"><div class="error">Loading the course…</div></main></div>
</div></div>
<script>
(()=>{
const TOTAL=40,page=document.getElementById('lessonPage'),desktop=document.getElementById('desktopLessons'),mobile=document.getElementById('mobileList');let lessons=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roman=n=>{const map=[[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let v=n,r='';for(const [a,s] of map){while(v>=a){r+=s;v-=a}}return r};
const completeKey=n=>'spanish-experiment-complete-'+n;
function isComplete(n){return localStorage.getItem(completeKey(n))==='yes'}
function record(n){return lessons.find(x=>Number(x.number)===n)||{number:n,roman:roman(n),publicationStatus:'coming-soon',title:'Lección '+roman(n),status:'Coming soon'}}
function published(x){return x.publicationStatus==='published'}
function requested(){const n=Number(new URLSearchParams(location.search).get('lesson'));return Number.isInteger(n)&&n>=1&&n<=TOTAL?n:1}
function updateProgress(){const done=Array.from({length:TOTAL},(_,i)=>i+1).filter(isComplete).length;document.getElementById('progressChip').textContent=done+' of '+TOTAL+' complete';document.getElementById('progressBar').style.width=(done/TOTAL*100)+'%';document.querySelectorAll('.lesson-link').forEach(b=>b.classList.toggle('complete',isComplete(Number(b.dataset.number))))}
function buildList(target){target.innerHTML='';for(let n=1;n<=TOTAL;n++){const l=record(n),b=document.createElement('button');b.className='lesson-link '+(published(l)?'published':'coming');b.dataset.number=n;b.innerHTML='<span class="icon">'+roman(n)+'</span><span><strong>Lección '+roman(n)+'</strong><small>'+(published(l)?esc(l.title):'Awaiting study')+'</small></span>';b.onclick=()=>{render(n,true);if(target===mobile){mobile.classList.remove('open');mobileToggle.textContent='Show lessons'}};target.appendChild(b)}}
function setActive(n){document.querySelectorAll('.lesson-link').forEach(b=>b.classList.toggle('active',Number(b.dataset.number)===n))}
const stages=[
{es:'Escucha y lee',en:'Listen and read',summary:'Hear the Spanish and follow the text.',detail:'Begin with Hall Avilés’ original lesson. Read for meaning before stopping over every detail.',colour:'#aa151b'},
{es:'Observa',en:'Notice',summary:'Spot repeated forms, agreement and word order.',detail:'Write down what stands out. Uncertainty is evidence of learning, not failure.',colour:'#f1bf00'},
{es:'Comprende',en:'Understand',summary:'Explain the pattern in ordinary English.',detail:'Use a plain explanation only after the Spanish has had a chance to become familiar.',colour:'#aa151b'},
{es:'Practica',en:'Practise',summary:'Say it aloud, write it down and vary it.',detail:'Answer the questions, change the nouns and use the pattern with a Spanish speaker.',colour:'#f1bf00'},
{es:'Recuerda',en:'Recall',summary:'Close the book and rebuild the lesson.',detail:'Compare the first and second attempts and record what changed.',colour:'#aa151b'}];
function stagesHtml(){return stages.map((s,i)=>'<button class="path-card" style="--stage:'+s.colour+'" aria-expanded="false"><div class="colour"></div><div class="inside"><span class="path-number">'+(i+1)+'</span><h3>'+s.es+'</h3><span class="eng">'+s.en+'</span><p>'+s.summary+'</p><div class="path-detail">'+s.detail+'</div></div></button>').join('')}
function readingsHtml(l,after=false){return (l.readings||[]).map(r=>'<article class="audio-card"><h3>'+esc(r.title)+'</h3><span class="tag">'+(after?'second reading · after study':'first reading · before study')+'</span><p>'+(after?'Return after study and compare pace, recognition and confidence.':'Make an honest first attempt before polishing or correcting it.')+'</p><div class="audio-placeholder"><button class="play" disabled>▶</button><span>Recording to be added</span><span class="audio-line"></span></div></article>').join('')}
function publishedHtml(l){return '<div class="breadcrumbs">Course <span>›</span> Parte Primera <span>›</span> Lección '+l.roman+'</div><div class="lesson-grid"><div class="main-column"><section class="hero"><div><p class="kicker">Parte Primera · learning module</p><h1>Lección '+l.roman+'</h1><p class="subtitle">'+esc(l.title)+'</p><p class="lede">'+esc(l.lede)+'</p><div class="hero-facts"><div class="fact"><strong>Based on</strong><span>Guillermo F. Hall Avilés<br><em>Poco a Poco</em></span></div><div class="fact"><strong>Estimated time</strong><span>'+esc(l.estimatedTime)+'</span></div><div class="fact"><strong>Aim</strong><span>'+esc(l.aim)+'</span></div></div></div><div class="hero-visual"><div class="spanish">¿QUÉ ES?</div><div class="day-note">'+esc(l.dayNote)+'</div></div></section><section class="section curiosity"><span class="curiosity-label">Curiosity hook</span><h2>'+esc(l.curiosityTitle)+'</h2><p>'+esc(l.curiosityText)+'</p><div class="sample-spanish">'+esc(l.curiositySample)+'</div></section><section class="section"><div class="section-head"><div><h2>First reading</h2><p>Read or record before working through the lesson.</p></div></div><div class="reading-grid">'+readingsHtml(l,false)+'</div><div class="section-head" style="margin-top:32px"><div><h2>Between the readings</h2><p>Work through the original textbook before returning.</p></div></div><div class="study-sequence">'+(l.studySteps||[]).map((s,i)=>'<article class="study-step"><span class="step-number">'+(i+1)+'</span><div><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div></article>').join('')+'</div><div class="section-head" style="margin-top:32px"><div><h2>Second reading</h2><p>Return after vocabulary, handwriting, explanation and practice.</p></div></div><div class="reading-grid">'+readingsHtml(l,true)+'</div><article class="reader-turn"><span class="eyebrow">Your part in the experiment</span><h2>Your turn</h2><p>Check each stage as you complete it. Nothing is uploaded or shared.</p><div class="reader-checklist">'+(l.checklist||[]).map(item=>'<label class="reader-check"><input type="checkbox"><span><strong>'+esc(item)+'</strong></span></label>').join('')+'</div></article></section><section class="section"><div class="section-head"><div><h2>Your path through this lesson</h2><p>The same five stages are used for every published lesson.</p></div></div><div class="path-grid">'+stagesHtml()+'</div></section><section class="section lower-grid"><article class="content-card"><span class="eyebrow">Today’s Spanish</span><h3>What Lección '+l.roman+' reveals</h3><div class="lesson-reflection">'+esc(l.todaySpanish||l.todayLatin||'The real reflection will be added after study.')+'</div></article><article class="content-card"><span class="eyebrow">My notebook</span><h3>The evidence of learning</h3><p>'+esc(l.notebookCaption||'Notebook evidence will be added after study.')+'</p></article></section></div><aside class="side-column"><article class="side-card"><h3>Why Spanish?</h3><p>The personal reason for this experiment will be developed separately.</p><a href="why-spanish.html?return=course.html%3Flesson='+l.number+'">Explore the question →</a></article><article class="side-card gold"><h3>Have the book?</h3><p>This website accompanies <em>Poco a Poco</em>. Use the book as the primary text.</p><a href="index.html#materials">Find the source →</a></article><article class="side-card"><h3>My experiment</h3><p>Follow the notes, hesitant recordings, errors, corrections and small victories.</p><a href="experiment.html#'+esc(l.journalSlug)+'">Open the journal →</a></article><article class="side-card manifesto"><h3>One book.<br>Forty lessons.<br>A real experiment.</h3><p>Can a public-domain direct-method course still produce useful Spanish?</p></article><button class="complete-button '+(isComplete(l.number)?'done':'')+'" id="completeButton">'+(isComplete(l.number)?'Lección '+l.roman+' completed':'Mark Lección '+l.roman+' complete')+'</button></aside></div>'}
function comingHtml(l){return '<div class="breadcrumbs">Course <span>›</span> Parte Primera <span>›</span> Lección '+l.roman+'</div><section class="coming-page"><div class="coming-mark">'+l.roman+'</div><p class="kicker">Lección '+l.roman+'</p><h1>Coming soon.</h1><p class="subtitle">'+esc(l.title||'The next stage of the experiment')+'</p><p class="lede">This lesson has not yet been studied and published. No learning claim is being made in advance.</p><div class="coming-grid"><article><span>1</span><h2>Learn</h2><p>Work through the original lesson in <em>Poco a Poco</em>.</p></article><article><span>2</span><h2>Record</h2><p>Preserve the reading, handwriting, difficulties and corrections.</p></article><article><span>3</span><h2>Publish</h2><p>Add the completed lesson to this site using the same template.</p></article></div><p><a href="index.html#materials">Open the course materials →</a></p></section>'}
function render(n,update=false){const l=record(n);setActive(n);page.dataset.lessonNumber=n;page.innerHTML=published(l)?publishedHtml(l):comingHtml(l);document.title='The Spanish Experiment — Lección '+l.roman;if(update){const u=new URL(location.href);u.searchParams.set('lesson',n);history.replaceState({},'',u.pathname+u.search)}page.querySelectorAll('.path-card').forEach(c=>c.onclick=()=>c.setAttribute('aria-expanded',String(c.getAttribute('aria-expanded')!=='true')));const complete=document.getElementById('completeButton');if(complete)complete.onclick=()=>{localStorage.setItem(completeKey(n),isComplete(n)?'no':'yes');render(n,false);updateProgress()};scrollTo({top:0,behavior:'smooth'})}
fetch('lessons-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Lesson data could not be loaded.');return r.json()}).then(data=>{lessons=Array.isArray(data.lessons)?data.lessons:[];buildList(desktop);buildList(mobile);render(requested(),false);updateProgress()}).catch(e=>page.innerHTML='<div class="error"><strong>The course could not be loaded.</strong><br>'+esc(e.message)+'</div>');
document.getElementById('mobileToggle').onclick=()=>{mobile.classList.toggle('open');mobileToggle.textContent=mobile.classList.contains('open')?'Hide lessons':'Show lessons'};
})();
</script>
</body>
</html>
